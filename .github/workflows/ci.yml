name: CI

on:
  push:
  pull_request:

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash install.sh --dir "$RUNNER_TEMP/opencode-skills"

      - name: Verify (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash verify.sh "$RUNNER_TEMP/opencode-skills"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -SkillDir "$env:RUNNER_TEMP/opencode-skills"

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verify.ps1 -SkillDir "$env:RUNNER_TEMP/opencode-skills"
